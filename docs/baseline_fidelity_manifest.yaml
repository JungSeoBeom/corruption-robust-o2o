schema_version: 4
audit_date: "2026-08-21"
status_note: >-
  This manifest describes the executable custom research benchmark. It records
  source and task scope honestly, but does not claim bitwise parity or official
  paper-budget reproduction. Documentation does not override executable config,
  manifests, or completed-run evidence.

research_benchmark_contract:
  run_purpose: research_benchmark
  suite_profile: research_benchmark
  main_baselines:
    - rpex
    - riql_naive
    - wsrl
    - cal_ql
    - pessimistic_q_ensemble
  main_baseline_count: 5
  canonical_new_run_names_only: true
  historical_result_aliases:
    cal_ql_locomotion_adaptation: cal_ql
    pqe_shared_actor_approx: pessimistic_q_ensemble
  corruption_application_contract: replay_transition_poisoning
  default_offline_corruption_rate: 0.3
  default_online_corruption_rate: 0.5
  default_corruption_range: 1.0
  clean_evaluation_environment: true
  common_final_evaluation_window: 3
  common_interaction_budget: true
  compute_matched: false
  note: >-
    Cal-QL is a frozen locomotion adaptation and PQE is a v0-to-v2 port, but
    both remain main comparison algorithms. PQE's approximately fivefold
    offline gradient compute is recorded rather than used to exclude it.

research_readiness_contract:
  config_ready_checks:
    - exactly_five_canonical_main_baselines
    - calql_online_calibration_enabled
    - calql_two_by_256_network
    - calql_bc_warmup_zero
    - calql_online_cql_weight_five
    - pqe_five_independent_actors
    - pqe_five_independent_twin_critic_pairs
    - pqe_no_shared_parameter_storage
    - pqe_balanced_priority_replay
    - pqe_five_checkpoint_generation_or_loading_plan
    - wsrl_protocol_invariants
    - riql_positive_online_actor_learning_rate
    - selected_adversarial_target_and_checkpoint_valid
    - clean_evaluation
    - collision_free_output_path
  completed_run_evidence:
    - calql_completed_online_trajectory_count_positive
    - calql_online_mc_return_valid_fraction_one
    - calql_online_gradient_updates_positive
    - five_content_distinct_pqe_member_checkpoint_files_and_hashes
  missing_runtime_evidence_status: PENDING
  pending_is_not_pass: true
  excluded_gates:
    - upstream_rng_trajectory
    - same_seed_same_corruption_mask
    - bitwise_parameter_equality
    - cross_framework_numerical_parity
    - fixed_batch_parity_certificate
    - golden_fixture_certificate
    - upstream_receipt_or_audit_certificate
    - official_paper_step_budget
    - fixed_seed_cohort

reporting_contract:
  phase: online
  evaluation_environment: clean
  per_seed_statistic: mean_last_k_evaluations
  default_k: 3
  cross_seed_statistic: population_mean_and_std
  prohibited_selection:
    - best_checkpoint
    - best_evaluation
    - best_ensemble_member
    - silent_failed_seed_exclusion
    - silent_nonfinite_seed_exclusion
    - partial_run_as_completed
  calql_and_pqe_in_main_summary: true

baselines:
  rpex:
    display_name: RPEX
    benchmark_role: main
    main_table_eligible: true
    implementation_type: source_aligned_port
    task_scope: d4rl_locomotion_v2
    upstream_repository: "https://github.com/felix-thu/RPEX"
    upstream_commit: "35da71ee5151b6179d21b9a2b4ce1b6408aedd04"
    local_files:
      - robust_o2o/agents/iql_family.py
      - robust_o2o/experiment.py
    online_update_order: before_env_step_and_replay_insert
    action_execution: official_unsquashed_unclipped
    primary_evaluation: method_faithful_epsilon_q_switching
    secondary_evaluation: deterministic_diagnostic

  riql_naive:
    display_name: RIQL-naive
    benchmark_role: main
    main_table_eligible: true
    implementation_type: source_aligned_port
    task_scope: d4rl_locomotion_v2
    upstream_repository: "https://github.com/felix-thu/RPEX"
    upstream_commit: "35da71ee5151b6179d21b9a2b4ce1b6408aedd04"
    local_files:
      - robust_o2o/agents/iql_family.py
      - robust_o2o/experiment.py
    online_update_order: before_env_step_and_replay_insert
    action_execution: official_unsquashed_unclipped
    online_optimizer_transition:
      actor: fresh_adam_positive_lr
      critic: fresh_adam_positive_lr
      value: fresh_adam_positive_lr
      actor_scheduler: disabled_online

  wsrl:
    display_name: WSRL
    benchmark_role: main
    main_table_eligible: true
    implementation_type: framework_port
    task_scope: d4rl_locomotion_v2
    upstream_repository: "https://github.com/zhouzypaul/wsrl"
    upstream_commit: "ad4dc1248a138bc15d6e053f2d1dba1b8cfbaca2"
    local_files:
      - robust_o2o/agents/sac_family.py
      - robust_o2o/cql.py
      - robust_o2o/experiment.py
    protocol:
      offline_pretrainer: cql_redq
      critic_count: 10
      target_critic_subset: 2
      critic_utd: 4
      frozen_warmup_steps: 5000
      online_replay: online_only
      offline_data_retained_online: false
      actor_lr: 0.0001
      critic_lr: 0.0003
      temperature_lr: 0.0001
      backup_entropy: false

  cal_ql:
    display_name: Cal-QL (D4RL locomotion adaptation)
    benchmark_role: main
    main_table_eligible: true
    implementation_type: source_aligned_locomotion_adaptation
    task_scope: d4rl_locomotion_adaptation
    official_locomotion_recipe: false
    upstream_repository: "https://github.com/nakamotoo/Cal-QL"
    upstream_commit: "ac6eafec22e8d60836573e1f488c7f626ce8a77e"
    upstream_official_recipes: [antmaze, adroit]
    benchmark_tasks:
      - hopper-medium-replay-v2
      - halfcheetah-medium-replay-v2
      - walker2d-medium-replay-v2
    local_files:
      - robust_o2o/agents/calql.py
      - robust_o2o/calql_online.py
      - robust_o2o/experiment.py
    frozen_protocol:
      hidden_layers: 2
      hidden_width: 256
      orthogonal_initialization: true
      actor_lr: 0.0001
      critic_lr: 0.0003
      temperature_lr: 0.0001
      target_update_rate: 0.005
      batch_size: 256
      target_entropy: negative_action_dim
      actor_loss: sac_from_first_update
      bc_warmup_steps: 0
      calibration_offline: true
      calibration_online: true
      calibration_proposals: [current_policy_actions, next_policy_actions]
      cql_sampled_actions: 10
      cql_temperature: 1.0
      cql_importance_sampling: true
      cql_max_target_backup: true
      cql_backup_entropy: false
      cql_alpha_offline: 5.0
      cql_alpha_online: 5.0
      offline_mc_return_source: post_corruption
      online_mc_return_source: completed_post_corruption_trajectory
      pending_episode_fake_return_forbidden: true
      replay_mixture: offline_size_over_offline_plus_completed_online_size
      update_schedule: completed_trajectory_length_times_utd

  pessimistic_q_ensemble:
    display_name: Pessimistic Q-Ensemble (D4RL-v2 port)
    benchmark_role: main
    main_table_eligible: true
    implementation_type: source_aligned_d4rl_v2_port
    task_scope: d4rl_v2_port
    upstream_repository: "https://github.com/shlee94/Off2OnRL"
    upstream_commit: "6f298fa9ef040d725067d0f2775022bd2900d635"
    upstream_task_version: v0
    benchmark_task_version: v2
    offline_compute_multiplier: 5
    interaction_budget_matched: true
    compute_budget_matched: false
    local_files:
      - robust_o2o/agents/pessimistic_q_ensemble.py
      - robust_o2o/replay.py
      - robust_o2o/experiment.py
    frozen_protocol:
      ensemble_size: 5
      member_seed_rule: base_seed_plus_four_times_member_index
      actors_independent: true
      twin_critic_pairs_independent: true
      target_critic_pairs_independent: true
      shared_actor: false
      shared_parameter_storage: false
      member_pretrainer: plain_cql
      member_offline_artifact: same_immutable_corrupted_artifact
      member_checkpoint_count: 5
      duplicate_checkpoint_content_forbidden: true
      online_actor_loss: ensemble_mean_of_member_min_twin_q
      target_update_rate: 0.005
      actor_lr: 0.0003
      critic_lr: 0.0003
      temperature_lr: 0.0003
      cql_online: false
      deployed_policy: moment_matched_pre_tanh_gaussian
      deterministic_evaluation: tanh_of_average_pre_tanh_mean
      best_member_selection: false
      replay: balanced_density_ratio_priority
      density_temperature: 5.0
      priority_clip: [0.001, 1000.0]
      initial_online_fraction: 0.75
      first_epoch_multiplier: 5
      first_online_block_steps: 1000
      online_buffer_size: 250000
      weight_batch_size: 256

remaining_limitations:
  - >-
    Cal-QL is a frozen source-aligned locomotion adaptation because the pinned
    release does not publish an official locomotion recipe.
  - >-
    Pessimistic Q-Ensemble ports a public D4RL-v0 method to the benchmark's
    common D4RL-v2 artifact; it must not be described as official v0 reproduction.
  - >-
    PQE performs approximately five times the offline gradient compute of a
    single-agent baseline. The benchmark equalizes interaction budgets, not
    wall-clock time or total gradient FLOPs.
  - >-
    Long D4RL/MuJoCo experiments are runtime evidence. If they have not been
    executed, readiness reports them as PENDING rather than PASS.
